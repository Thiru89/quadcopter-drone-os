; PlatformIO Project Configuration File for Quadrapuller Drone OS (QPOS)
; Multi-target configuration: STM32H743VIT6, STM32F405/F411, and ESP32-S3

[platformio]
default_envs = stm32h743vit6
src_dir = src
include_dir = include

[common]
build_flags = 
    -O3
    -Wall
    -Wextra
    -DARM_MATH_CM7
    -DQPOS_FIRMWARE_BUILD
    -Iinclude

; ==============================================================================
; TARGET 1: High-Performance Flight Controller (STM32H743VIT6 - 480 MHz Cortex-M7)
; ==============================================================================
[env:stm32h743vit6]
platform = ststm32
board = genericSTM32H743VIT6
framework = stm32cube
build_flags = 
    ${common.build_flags}
    -mfloat-abi=hard
    -mfpu=fpv5-d16
    -DSTM32H743xx
upload_protocol = stlink
debug_tool = stlink

; ==============================================================================
; TARGET 2: Compact Drone Flight Controller (STM32F411CE "BlackPill" / STM32F405)
; ==============================================================================
[env:stm32f411ce]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
build_flags = 
    ${common.build_flags}
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16
    -DSTM32F411xE
upload_protocol = dfu

; ==============================================================================
; TARGET 3: Dual-Core WiFi/BLE Companion FC (ESP32-S3 - 240 MHz Dual Xtensa)
; ==============================================================================
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
build_flags = 
    ${common.build_flags}
    -DESP32_S3_QPOS
monitor_speed = 921600
upload_speed = 921600
